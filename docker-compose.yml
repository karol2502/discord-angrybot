version: '3.8'

services:
  discord-bot:
    image: ghcr.io/karol2502/discord-angrybot:latest
    container_name: discord-angrybot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_APPLICATION_ID=${DISCORD_APPLICATION_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - BUN_ENV=production
    env_file:
      - .env
    ports:
      - '3000:3000'

    # Optional: Add health check
    healthcheck:
      test: ['CMD', 'bun', '--version']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Optional: Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
